name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx turbo build --filter=@clawvet/shared

      # Only the packages with tests. A bare `turbo test` also builds the CLI,
      # and tests must pass without packages/cli/dist (see the next step).
      - name: Run tests
        run: npx turbo test --filter=@clawvet/shared --filter=@clawvet/api --force

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Verify CLI works
        run: node packages/cli/dist/index.js --version
