name: Release

# Publishes the CLI to npm when a v* tag is pushed.
#
# The Claude Code plugin marketplace needs no publish step — users install
# straight from this repo, so pushing the tag is already the release.
# ClawHub has no public publish API; that listing is updated by hand.
on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx turbo build --filter=@clawvet/shared

      - name: Run tests
        run: npx vitest run
        working-directory: apps/api

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      # Guard against tagging a release whose package.json was never bumped —
      # npm would reject the duplicate anyway, but failing here says why.
      - name: Tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
