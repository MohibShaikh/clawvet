name: Release

# Publishes the CLI to npm when a v* tag is pushed.
#
# The Claude Code plugin marketplace needs no publish step — users install
# straight from this repo, so pushing the tag is already the release.
# ClawHub has no public publish API; that listing is updated by hand.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      # write is needed to create the GitHub Release below.
      contents: write
      # required for npm provenance, which signs the tarball via OIDC so users
      # can verify it was built from this repo (`npm audit signatures`).
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx turbo build --filter=@clawvet/shared

      - name: Run tests
        run: npx vitest run
        working-directory: apps/api

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      # Guard against tagging a release whose package.json was never bumped —
      # npm would reject the duplicate anyway, but failing here says why.
      - name: Tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keep the Releases page in step with the tags. Without this, a tag ships
      # to npm while the public Releases page still advertises an older version.
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
